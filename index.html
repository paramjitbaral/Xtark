<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtark | Building The Future</title>
    <meta name="description" content="Xtark - Building something better. Our new website is coming soon.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Vanta 3D Fluid Background (Low Poly Style) -->
    <div id="vanta-canvas"></div>
    
    <div class="layout-container">
        <!-- 3D Parallax Tilt Wrapper -->
        <div class="tilt-wrapper" data-tilt data-tilt-max="3" data-tilt-speed="400" data-tilt-perspective="1000">
            
            <main class="hero-center">
                
                <div class="reveal-container delay-1">
                    <div class="logo-wrapper">
                        <img src="BGR LOGO.png" alt="Xtark" class="logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="logo-fallback" style="display: none;">X</div>
                    </div>
                </div>

                <div class="reveal-container delay-2">
                    <h1 class="brand-name">
                        <span class="text-gradient">XTARK</span>
                    </h1>
                </div>
                
                <div class="reveal-container delay-3">
                    <p class="tagline">Build &times; Innovate &times; Elevate</p>
                </div>

                <div class="reveal-container delay-4">
                    <div class="status-indicator">
                        <div class="pulse-ring"></div>
                        <span>COMING SOON</span>
                    </div>
                </div>
                
                <div class="reveal-container delay-5 form-container">
                    <form class="minimal-form" onsubmit="event.preventDefault();">
                        <div class="input-group">
                            <input type="email" placeholder="Enter email for early access" required>
                            <button type="submit" class="submit-btn" aria-label="Submit">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </main>

        </div>
    </div>

    <!-- Scripts for Elegant 3D Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    
    <script>
        // Initialize 3D Low-Poly Waves
        VANTA.WAVES({
          el: "#vanta-canvas",
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.00,
          minWidth: 200.00,
          scale: 1.00,
          scaleMobile: 1.00,
          color: 0x0a0a0a,      
          shininess: 15.00,     
          waveHeight: 12.00,    
          waveSpeed: 0.40,      
          zoom: 0.85            
        });
    </script>
</body>
</html>
